<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi solecito 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="inicio" class="inicio">
        <div class="sol"></div>

        <div class="inicio-contenido">
            <div class="flor-icono">🌻</div>

            <h1>Tengo algo para ti...</h1>

            <p>
                Una pequeña sorpresa hecha con mucho cariño
            </p>

            <button id="comenzar">
                Comenzar 💛
            </button>
        </div>
    </div>


    <main id="contenido" class="contenido">

        <div class="cielo">
            <div class="luna"></div>

            <div class="estrella e1"></div>
            <div class="estrella e2"></div>
            <div class="estrella e3"></div>
            <div class="estrella e4"></div>
            <div class="estrella e5"></div>
            <div class="estrella e6"></div>
            <div class="estrella e7"></div>
            <div class="estrella e8"></div>
            <div class="estrella e9"></div>
            <div class="estrella e10"></div>
        </div>


        <div class="mensaje">
            <p>Con mucho amor para ti,</p>
            <p>estas flores por el <strong>21 de septiembre</strong> 🌻</p>
            <h2>Mi solecito 💛</h2>
        </div>


        <section class="jardin">

            <div class="girasol girasol1">
                <div class="tallo">
                    <div class="hoja hoja1"></div>
                    <div class="hoja hoja2"></div>
                </div>

                <div class="flor">
                    <div class="petalos">🌻</div>
                </div>
            </div>


            <div class="girasol girasol2">
                <div class="tallo">
                    <div class="hoja hoja1"></div>
                    <div class="hoja hoja2"></div>
                </div>

                <div class="flor">
                    <div class="petalos">🌻</div>
                </div>
            </div>


            <div class="girasol girasol3">
                <div class="tallo">
                    <div class="hoja hoja1"></div>
                    <div class="hoja hoja2"></div>
                </div>

                <div class="flor">
                    <div class="petalos">🌻</div>
                </div>
            </div>

        </section>


        <div class="letra">
            <p id="texto-letra"></p>
        </div>


        <div id="final" class="final">
            <div>🌻</div>
            <h1>Para mi solecito 💛</h1>
            <p>Con mucho amor.</p>
            <span>21 de septiembre</span>
        </div>

    </main>


    <audio id="musica" preload="auto">
        <source src="musica.mp3" type="audio/mpeg">
    </audio>


    <script src="script.js"></script>

</body>
</html>
